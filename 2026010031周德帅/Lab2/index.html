<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写给你的一封信 💌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  }

  body {
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fbc2eb 100%);
    background-size: 200% 200%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---- 漂浮爱心 ---- */
  .heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    animation: floatUp linear infinite;
    opacity: 0;
    z-index: 1;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(1); opacity: 0; }
    10%  { opacity: .85; }
    50%  { transform: translateY(-55vh) translateX(var(--drift)) rotate(var(--rot)) scale(1.05); opacity: .7; }
    100% { transform: translateY(-110vh) translateX(calc(var(--drift) * -0.6)) rotate(calc(var(--rot) * -1)) scale(.9); opacity: 0; }
  }

  /* ---- 中心卡片 ---- */
  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 56px 48px;
    max-width: 640px;
    width: calc(100% - 48px);
    text-align: center;
    box-shadow: 0 24px 60px rgba(214, 51, 108, 0.25);
    animation: cardIn 1.2s cubic-bezier(.22, 1, .36, 1) both;
  }

  @keyframes cardIn {
    from { transform: translateY(40px) scale(.94); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .envelope {
    font-size: 52px;
    display: inline-block;
    animation: bounce 2.2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  h1 {
    margin: 18px 0 26px;
    font-size: clamp(26px, 5vw, 40px);
    color: #c2185b;
    letter-spacing: 2px;
    font-weight: 700;
  }

  .line {
    font-size: clamp(16px, 2.6vw, 21px);
    line-height: 2.1;
    color: #6d2b45;
    opacity: 0;
    transform: translateY(14px);
    animation: lineIn .9s ease forwards;
  }

  @keyframes lineIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .highlight {
    margin-top: 30px;
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    background: linear-gradient(90deg, #e91e63, #ff6f91, #e91e63);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: lineIn .9s ease forwards, shine 3s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .pulse-heart {
    display: inline-block;
    margin-top: 26px;
    font-size: 44px;
    animation: heartbeat 1.4s ease-in-out infinite;
    opacity: 0;
    animation: heartbeat 1.4s ease-in-out infinite, lineIn .9s ease forwards;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.18); }
    40%      { transform: scale(.96); }
    60%      { transform: scale(1.12); }
  }

  .footer {
    margin-top: 26px;
    font-size: 13px;
    color: #a05a78;
    letter-spacing: 4px;
    opacity: 0;
    animation: lineIn .9s ease forwards;
  }

  @media (max-width: 480px) {
    .card { padding: 40px 24px; }
  }
</style>
</head>
<body>

<div class="card">
  <span class="envelope">💌</span>
  <h1>写给你</h1>

  <p class="line" style="animation-delay: .8s">世界那么大，人来人往，</p>
  <p class="line" style="animation-delay: 1.6s">而我偏偏，只想走向你。</p>
  <p class="line" style="animation-delay: 2.4s">你笑起来的样子，</p>
  <p class="line" style="animation-delay: 3.2s">是我见过最美的风景。</p>
  <p class="line" style="animation-delay: 4.0s">往后余生的每一个春夏秋冬，</p>
  <p class="line" style="animation-delay: 4.8s">都想和你一起慢慢走过。</p>

  <p class="highlight" style="animation-delay: 5.8s">我喜欢你，很久了。❤</p>

  <div class="pulse-heart" style="animation-delay: 6.8s">💖</div>

  <p class="footer" style="animation-delay: 7.6s">—— 一个一直默默喜欢你的人 ——</p>
</div>

<script>
  // 生成漂浮爱心
  const HEARTS = ['❤️', '💕', '💗', '💓', '💞', '🩷', '💘'];
  const COLORS = ['#ff5e78', '#ff8fa3', '#ffb3c1', '#e91e63', '#f06292'];

  function spawnHeart() {
    const el = document.createElement('div');
    el.className = 'heart';

    const size = 14 + Math.random() * 26;
    const useEmoji = Math.random() > 0.4;

    if (useEmoji) {
      el.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
      el.style.fontSize = size + 'px';
    } else {
      // CSS 绘制的小爱心
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.position = 'fixed';
      el.innerHTML =
        '<svg viewBox="0 0 32 29" width="' + size + '" height="' + size + '">' +
        '<path fill="' + color + '" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,20.4 c6.1-8.5,16-11,16-20.4C32,3.8,28.2,0,23.6,0z"/></svg>';
    }

    el.style.left = Math.random() * 100 + 'vw';
    el.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    el.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
    el.style.animationDuration = (7 + Math.random() * 7) + 's';

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 14500);
  }

  // 初始一批 + 持续生成
  for (let i = 0; i < 14; i++) setTimeout(spawnHeart, i * 350);
  setInterval(spawnHeart, 600);
</script>

</body>
</html>
