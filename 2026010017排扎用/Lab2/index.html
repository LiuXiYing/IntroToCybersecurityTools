<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>写给你 · 三行情书</title>
<style>
  :root{
    /* 全部使用系统自带字体，不加载任何外部字体或样式资源 */
    --ff-kai:"KaiTi","STKaiti","Kaiti SC","BiauKai","DFKai-SB","楷体",serif;
    --ff-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC","WenQuanYi Micro Hei",system-ui,sans-serif;
    --bg-0:#0b0710;
    --bg-1:#1a0d1f;
    --bg-2:#2a1226;
    --rose:#ff8fb1;
    --rose-deep:#ff5f8d;
    --gold:#ffd9a0;
    --cream:#fdeef3;
    --ink-dim:rgba(253,238,243,.55);
    --vignette:rgba(6,3,9,.75);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}

  body{
    font-family:var(--ff-sans);
    background:radial-gradient(ellipse at 50% -10%,var(--bg-2) 0%,var(--bg-1) 38%,var(--bg-0) 100%);
    color:var(--cream);
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 背景层：流动光晕 + 星点 ===== */
  .aurora{
    position:fixed;inset:-30%;
    z-index:0;pointer-events:none;
    filter:blur(70px);opacity:.55;
  }
  .aurora span{
    position:absolute;border-radius:50%;display:block;
  }
  .aurora .a1{width:46vmax;height:46vmax;left:-8%;top:2%;
    background:radial-gradient(circle,rgba(255,95,141,.55),transparent 62%);
    animation:float1 19s ease-in-out infinite;}
  .aurora .a2{width:40vmax;height:40vmax;right:-6%;top:14%;
    background:radial-gradient(circle,rgba(196,120,255,.45),transparent 62%);
    animation:float2 23s ease-in-out infinite;}
  .aurora .a3{width:52vmax;height:52vmax;left:16%;bottom:-14%;
    background:radial-gradient(circle,rgba(255,180,120,.32),transparent 64%);
    animation:float3 27s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(9vmax,6vmax) scale(1.14);}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1.08);}50%{transform:translate(-8vmax,9vmax) scale(.92);}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(6vmax,-7vmax) scale(1.18);}}

  #stars{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .star{
    position:absolute;background:#fff;border-radius:50%;
    animation:twinkle var(--dur,3.4s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes twinkle{0%,100%{opacity:.08;transform:scale(.6);}50%{opacity:.95;transform:scale(1.15);}}

  /* ===== 漂浮爱心 ===== */
  #hearts{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
  .petal{
    position:absolute;bottom:-8vh;
    font-size:var(--fs,16px);
    opacity:0;
    animation:riseUp var(--t,13s) linear forwards;
    will-change:transform,opacity;
    filter:drop-shadow(0 0 6px rgba(255,143,177,.55));
  }
  @keyframes riseUp{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}
    8%{opacity:var(--op,.85);}
    88%{opacity:var(--op,.85);}
    100%{transform:translateY(-118vh) translateX(var(--dx,20px)) rotate(var(--rot,180deg));opacity:0;}
  }

  /* ===== 主体 ===== */
  .stage{
    position:relative;z-index:5;
    width:100%;max-width:760px;
    padding:clamp(52px,11vh,120px) 26px clamp(70px,12vh,130px);
    display:flex;flex-direction:column;align-items:center;
  }

  /* 顶部小标 */
  .eyebrow{
    font-size:12px;letter-spacing:.62em;text-indent:.62em;
    color:var(--gold);opacity:.72;font-weight:300;
    margin-bottom:clamp(34px,7vh,64px);
    text-align:center;
  }

  /* 标题 */
  .title-wrap{text-align:center;margin-bottom:clamp(40px,8vh,78px);}
  .title{
    font-family:var(--ff-kai);
    font-weight:700;
    font-size:clamp(52px,13vw,92px);
    line-height:1.18;
    letter-spacing:.06em;
    background:linear-gradient(120deg,#fff0f5 0%,var(--rose) 32%,var(--gold) 58%,var(--rose-deep) 82%,#fff0f5 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    animation:shimmer 7s ease-in-out infinite;
    filter:drop-shadow(0 4px 30px rgba(255,95,141,.35));
  }
  @keyframes shimmer{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}

  .title-sub{
    margin-top:18px;font-size:clamp(12px,3.2vw,14px);
    letter-spacing:.42em;text-indent:.42em;color:var(--ink-dim);font-weight:200;
  }
  .title-rule{
    width:108px;height:1px;margin:26px auto 0;
    background:linear-gradient(90deg,transparent,rgba(255,217,160,.85),transparent);
  }

  /* 情书卡片 */
  .letter{
    position:relative;width:100%;
    padding:clamp(34px,6.4vw,54px) clamp(22px,5.6vw,48px);
    border-radius:26px;
    background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.022) 46%,rgba(255,95,141,.055));
    border:1px solid rgba(255,190,214,.22);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 26px 70px -24px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.13);
  }
  .letter::before,.letter::after{
    content:"";position:absolute;font-size:70px;line-height:1;
    font-family:Georgia,serif;color:rgba(255,190,214,.2);pointer-events:none;
  }
  .letter::before{content:"\201C";top:10px;left:16px;}
  .letter::after{content:"\201D";bottom:-6px;right:18px;}

  /* 三行 */
  .verse{
    display:block;
    text-align:center;
    font-weight:300;
    font-size:clamp(20px,5.4vw,31px);
    line-height:1.95;
    letter-spacing:.075em;
    color:var(--cream);
    text-shadow:0 0 26px rgba(255,143,177,.32);
    opacity:0;transform:translateY(22px);
    transition:opacity 1.15s cubic-bezier(.22,.7,.3,1),transform 1.15s cubic-bezier(.22,.7,.3,1);
  }
  .verse.show{opacity:1;transform:translateY(0);}
  .verse.feature{
    font-family:var(--ff-kai);
    font-weight:700;
    font-size:clamp(30px,8.4vw,50px);
    line-height:1.62;
    letter-spacing:.045em;
    background:linear-gradient(115deg,var(--rose) 0%,var(--gold) 52%,var(--rose-deep) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:none;
    margin:10px 0;
  }
  .verse .accent{
    color:var(--gold);
    font-weight:400;
    position:relative;
    white-space:nowrap;
  }
  .verse .accent::after{
    content:"";position:absolute;left:0;right:0;bottom:-3px;height:6px;
    background:linear-gradient(90deg,transparent,rgba(255,217,160,.42),transparent);
    border-radius:4px;
  }
  .divider-dot{
    display:flex;justify-content:center;gap:11px;margin:clamp(20px,3.6vw,30px) 0;
    opacity:0;transition:opacity 1.1s ease;
  }
  .divider-dot.show{opacity:.62;}
  .divider-dot i{
    width:4px;height:4px;border-radius:50%;background:var(--gold);
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  .divider-dot i:nth-child(2){animation-delay:.34s;}
  .divider-dot i:nth-child(3){animation-delay:.68s;}
  @keyframes pulseDot{0%,100%{opacity:.24;transform:scale(.75);}50%{opacity:1;transform:scale(1.35);}}

  /* 落款 */
  .sign{
    margin-top:clamp(28px,5vw,42px);
    text-align:right;
    font-size:clamp(12px,3vw,14px);
    letter-spacing:.2em;
    color:var(--ink-dim);
    opacity:0;transition:opacity 1.2s ease;
  }
  .sign.show{opacity:1;}
  .sign .name{
    font-family:var(--ff-kai);
    font-weight:700;
    font-size:clamp(20px,4.4vw,26px);
    letter-spacing:.1em;
    color:var(--rose);
    margin-left:6px;
  }

  /* 按钮 */
  .actions{
    margin-top:clamp(46px,9vh,80px);
    display:flex;flex-direction:column;align-items:center;gap:22px;
    width:100%;
  }
  .btn{
    position:relative;
    padding:16px 52px;
    border:none;border-radius:999px;
    font-family:inherit;font-size:16px;letter-spacing:.28em;text-indent:.28em;
    color:#3a0a1c;font-weight:600;
    background:linear-gradient(120deg,#fff0f5,var(--rose) 40%,var(--gold) 100%);
    background-size:200% 100%;
    cursor:pointer;
    box-shadow:0 14px 38px -10px rgba(255,95,141,.72),inset 0 1px 0 rgba(255,255,255,.65);
    transition:transform .32s cubic-bezier(.2,.8,.3,1),box-shadow .32s,background-position .6s;
    overflow:hidden;
  }
  .btn:hover{transform:translateY(-3px) scale(1.045);background-position:100% 50%;
    box-shadow:0 20px 48px -10px rgba(255,95,141,.92),inset 0 1px 0 rgba(255,255,255,.7);}
  .btn:active{transform:translateY(-1px) scale(.99);}

  .btn-ghost{
    background:transparent;
    color:var(--rose);
    border:1px solid rgba(255,143,177,.45);
    box-shadow:none;
    padding:12px 34px;font-size:13.5px;letter-spacing:.22em;text-indent:.22em;
    font-weight:400;
  }
  .btn-ghost:hover{background:rgba(255,143,177,.1);border-color:rgba(255,143,177,.85);transform:translateY(-2px);}

  /* 隐藏的第四行：点击后浮现 */
  .secret{
    margin-top:clamp(34px,6vh,54px);
    max-width:600px;
    text-align:center;
    padding:clamp(24px,4.6vw,36px);
    border-radius:20px;
    border:1px dashed rgba(255,217,160,.32);
    background:rgba(255,217,160,.045);
    font-size:clamp(15px,3.7vw,18px);
    line-height:2.2;
    letter-spacing:.09em;
    color:var(--gold);
    opacity:0;max-height:0;overflow:hidden;padding-top:0;padding-bottom:0;
    transition:opacity 1s ease,max-height 1.1s ease,padding 1.1s ease,margin 1.1s ease;
  }
  .secret.show{opacity:1;max-height:640px;padding-top:clamp(24px,4.6vw,36px);padding-bottom:clamp(24px,4.6vw,36px);}

  /* 点击爆心 */
  .burst{
    position:fixed;pointer-events:none;z-index:999;
    font-size:20px;will-change:transform,opacity;
    animation:burstOut .95s ease-out forwards;
  }
  @keyframes burstOut{
    0%{transform:translate(-50%,-50%) scale(.3) rotate(0deg);opacity:1;}
    100%{transform:translate(calc(-50% + var(--bx,0px)),calc(-50% + var(--by,0px))) scale(1.35) rotate(var(--br,120deg));opacity:0;}
  }

  /* 页脚 */
  footer{
    position:relative;z-index:5;
    padding:0 20px 40px;
    font-size:11px;letter-spacing:.3em;
    color:rgba(253,238,243,.28);text-align:center;
  }

  /* 顶部提示 */
  .hint{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    z-index:8;font-size:11px;letter-spacing:.24em;
    color:rgba(253,238,243,.42);
    background:rgba(20,8,20,.55);border:1px solid rgba(255,190,214,.16);
    padding:8px 20px;border-radius:999px;
    backdrop-filter:blur(8px);
    opacity:0;animation:hintIn 1s ease 2.4s forwards;
    white-space:nowrap;
  }
  @keyframes hintIn{to{opacity:1;}}
  .hint.hide{opacity:0!important;transition:opacity .6s;}

  @media (max-width:480px){
    .letter{border-radius:22px;}
    .letter::before,.letter::after{font-size:54px;}
    .btn{padding:15px 40px;font-size:15px;}
    .hint{font-size:10px;letter-spacing:.16em;padding:7px 15px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.2s!important;}
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="a1"></span><span class="a2"></span><span class="a3"></span>
</div>
<div id="stars" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>

<main class="stage">

  <p class="eyebrow">三 行 情 书</p>

  <div class="title-wrap">
    <h1 class="title">写 给 你</h1>
    <p class="title-sub">TO MY ONE AND ONLY</p>
    <div class="title-rule"></div>
  </div>

  <article class="letter" id="letter">
    <p class="verse" data-step="0">我喜欢你，</p>
    <p class="verse" data-step="1">就像风走了八千里，</p>
    <p class="verse feature" data-step="2">不问归期，只奔向你。</p>

    <div class="divider-dot" data-step="3"><i></i><i></i><i></i></div>

    <p class="verse" data-step="4">我见过银河，</p>
    <p class="verse" data-step="5">也见过你眼里的光，</p>
    <p class="verse feature" data-step="6">原来<span class="accent">你是我的宇宙</span>。</p>

    <div class="divider-dot" data-step="7"><i></i><i></i><i></i></div>

    <p class="verse" data-step="8">往后的每一天，</p>
    <p class="verse" data-step="9">清晨有风，黄昏有云，</p>
    <p class="verse feature" data-step="10">而我的四季，都有你。</p>

    <div class="sign" data-step="11">
      写给我最爱的 <span class="name" id="herName">你</span>
    </div>
  </article>

  <div class="actions">
    <button class="btn" id="openBtn">拆 开 这 封 信</button>
    <button class="btn btn-ghost" id="moreBtn">还想对你说一句</button>
  </div>

  <div class="secret" id="secret">
    其实我不太会说漂亮话，<br>
    但我很确定一件事——<br>
    <b>以后的每一个“以后”，我都想有你。</b><br>
    做我女朋友，好吗？
  </div>

</main>

<footer>MADE WITH ♥ JUST FOR YOU</footer>

<div class="hint" id="hint">轻触屏幕任意处 · 会有心落下来</div>

<script>
(function(){
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 星点 ---------- */
  (function buildStars(){
    var box = document.getElementById("stars");
    var n = window.innerWidth < 640 ? 60 : 110;
    var frag = document.createDocumentFragment();
    for(var i=0;i<n;i++){
      var s = document.createElement("div");
      s.className = "star";
      var size = (Math.random()*1.9 + 0.6).toFixed(2);
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random()*100).toFixed(2) + "%";
      s.style.top = (Math.random()*100).toFixed(2) + "%";
      s.style.setProperty("--dur", (2.2 + Math.random()*4.2).toFixed(2) + "s");
      s.style.setProperty("--delay", (Math.random()*4).toFixed(2) + "s");
      frag.appendChild(s);
    }
    box.appendChild(frag);
  })();

  /* ---------- 漂浮爱心 ---------- */
  var HEART_CHARS = ["♥","♡","❤","❥","✦"];
  function spawnPetal(x, opts){
    opts = opts || {};
    var h = document.createElement("div");
    h.className = "petal";
    h.textContent = HEART_CHARS[Math.floor(Math.random()*HEART_CHARS.length)];
    h.style.left = (typeof x === "number" ? x : Math.random()*100) + "%";
    h.style.setProperty("--fs", ((opts.min||13) + Math.random()*((opts.max||26)-(opts.min||13))).toFixed(1) + "px");
    h.style.setProperty("--t", ((opts.tMin||10) + Math.random()*((opts.tMax||18)-(opts.tMin||10))).toFixed(2) + "s");
    h.style.setProperty("--dx", (Math.random()*180 - 90).toFixed(0) + "px");
    h.style.setProperty("--rot", (Math.random()*520 - 260).toFixed(0) + "deg");
    h.style.setProperty("--op", (0.45 + Math.random()*0.5).toFixed(2));
    h.style.color = Math.random() > .34 ? "#ff8fb1" : (Math.random() > .5 ? "#ffd9a0" : "#ffffff");
    h.addEventListener("animationend", function(){ h.remove(); });
    document.getElementById("hearts").appendChild(h);
  }
  if(!reduced){
    setInterval(function(){
      if(document.hidden) return;
      spawnPetal(null, {min:12,max:24,tMin:11,tMax:19});
    }, 620);
  }

  /* ---------- 点击爆心 ---------- */
  function burst(x,y){
    var n = 7;
    for(var i=0;i<n;i++){
      var b = document.createElement("div");
      b.className = "burst";
      b.textContent = HEART_CHARS[Math.floor(Math.random()*HEART_CHARS.length)];
      b.style.left = x + "px";
      b.style.top = y + "px";
      b.style.color = Math.random() > .5 ? "#ff8fb1" : "#ffd9a0";
      b.style.fontSize = (14 + Math.random()*20).toFixed(0) + "px";
      var ang = (Math.PI*2/n)*i + Math.random()*0.5;
      var dist = 50 + Math.random()*90;
      b.style.setProperty("--bx", (Math.cos(ang)*dist).toFixed(0) + "px");
      b.style.setProperty("--by", (Math.sin(ang)*dist - 30).toFixed(0) + "px");
      b.style.setProperty("--br", (Math.random()*300 - 150).toFixed(0) + "deg");
      b.addEventListener("animationend", function(){ this.remove(); });
      document.body.appendChild(b);
    }
  }

  var hintEl = document.getElementById("hint");
  document.addEventListener("click", function(e){
    if(e.target.closest && e.target.closest("button")) return;
    burst(e.clientX, e.clientY);
    if(hintEl) hintEl.classList.add("hide");
  }, {passive:true});
  document.addEventListener("touchstart", function(e){
    var t = e.touches[0];
    if(!t) return;
    if(e.target.closest && e.target.closest("button")) return;
    burst(t.clientX, t.clientY);
    if(hintEl) hintEl.classList.add("hide");
  }, {passive:true});

  /* ---------- 逐行浮现 ---------- */
  var items = Array.prototype.slice.call(document.querySelectorAll("[data-step]"))
    .sort(function(a,b){ return (+a.dataset.step) - (+b.dataset.step); });

  function stepDelay(el){
    return el.classList.contains("feature") ? 1050 : (el.classList.contains("divider-dot") ? 380 : 720);
  }
  function baseDelay(el, i){
    return i < 3 ? 900 + i*0 : 0;
  }

  function revealSequential(idx){
    if(idx >= items.length) return;
    var el = items[idx];
    var wait = idx === 0 ? 900 : stepDelay(items[idx-1]);
    setTimeout(function(){
      el.classList.add("show");
      revealSequential(idx + 1);
    }, wait);
  }

  var started = false;
  function startReveal(){
    if(started) return;
    started = true;
    revealSequential(0);
  }
  // 进入页面自动展开（手机上也是）
  if(document.readyState === "complete") setTimeout(startReveal, 260);
  else window.addEventListener("load", function(){ setTimeout(startReveal, 260); });

  /* ---------- 按钮：拆信 = 重播 ---------- */
  var openBtn = document.getElementById("openBtn");
  openBtn.addEventListener("click", function(){
    // 先收起来再重播，制造"重新拆一次"的感觉
    items.forEach(function(el){ el.classList.remove("show"); });
    var secret = document.getElementById("secret");
    secret.classList.remove("show");
    started = false;
    setTimeout(startReveal, 260);
    // 从按钮位置洒一把心
    var r = openBtn.getBoundingClientRect();
    for(var i=0;i<16;i++){
      (function(k){ setTimeout(function(){
        spawnPetal((r.left + r.width*(0.15+Math.random()*0.7)) / window.innerWidth * 100, {min:16,max:34,tMin:9,tMax:15});
      }, k*70); })(i);
    }
  });

  /* ---------- 隐藏的一句 ---------- */
  var moreBtn = document.getElementById("moreBtn");
  var secretEl = document.getElementById("secret");
  moreBtn.addEventListener("click", function(){
    secretEl.classList.toggle("show");
    moreBtn.textContent = secretEl.classList.contains("show") ? "收 起 这 句 话" : "还想对你说一句";
    if(secretEl.classList.contains("show")){
      for(var i=0;i<14;i++){
        (function(k){ setTimeout(function(){ spawnPetal(null,{min:18,max:36,tMin:9,tMax:14}); }, k*80); })(i);
      }
    }
  });

  /* ---------- 右下角长按 3 秒 ---------- */
  (function secretTap(){
    var count = 0, timer = null;
    var corner = document.createElement("div");
    corner.setAttribute("aria-hidden","true");
    corner.style.cssText = "position:fixed;right:0;bottom:0;width:96px;height:96px;z-index:9;";
    document.body.appendChild(corner);
    corner.addEventListener("click", function(){
      count++;
      clearTimeout(timer);
      timer = setTimeout(function(){ count = 0; }, 1600);
      if(count >= 5){
        count = 0;
        var msg = document.querySelector(".title-sub");
        if(msg){
          msg.textContent = "YOU ARE MY FOREVER";
          msg.style.transition = "opacity .5s";
          msg.style.opacity = ".4";
          setTimeout(function(){ msg.textContent = "TO MY ONE AND ONLY"; msg.style.opacity = "1"; }, 2600);
        }
        for(var i=0;i<30;i++){
          (function(k){ setTimeout(function(){ spawnPetal(null,{min:20,max:40,tMin:8,tMax:13}); }, k*60); })(i);
        }
      }
    });
  })();

  /* ---------- 可选：名字 ---------- */
  try{
    var q = new URLSearchParams(location.search);
    var nm = q.get("to") || q.get("name");
    if(nm){
      var nameEl = document.getElementById("herName");
      nameEl.textContent = decodeURIComponent(nm).slice(0, 12);
    }
  }catch(err){}

})();
</script>
